# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/dependabot-2.0.json
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    # The test/ directory contains intentionally-vulnerable fixture projects.
    # audit-ci's test suite verifies that vulnerabilities are detected, so
    # these fixtures must keep their vulnerable dependencies. They are not
    # shipped to users, so exclude them from Dependabot scans to avoid noise.
    # See test/README.md for details.
    exclude-paths:
      - "test/**"
    ignore:
      - dependency-name: "mocha"
        # Drops support for Node 12
        versions: ["10.x"]
      - dependency-name: "sinon"
        # Drops support for Node 12
        versions: ["14.x"]
